        <!-- ✅ NEW: Watch Later Section -->

            <h3 style="margin-bottom:6px;">🔖 Watch Later</h3>
            <div class="history-grid" id="watchLaterGrid"></div>
        </div>

    <!-- ✅ NEW: Playlist View Overlay — کسی مخصوص Playlist کی تمام ویڈیوز/Reels ایک گرڈ میں -->

        <div class="playlist-view-header">
            <h3 id="playlistViewTitle">🎞️ Playlist</h3>
            <button id="closePlaylistViewBtn" class="reels-close-btn" aria-label="Close Playlist" style="position:static;">&times;</button>
        </div>
        <section class="video-grid" id="playlistViewGrid"></section>
    </div>

    <!-- Video Player Modal -->

                    <!-- ✅ NEW: Copy Link Button (3) -->
